name: Ecom Frontend CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ecom-frontend:latest

          docker build \
            --build-arg VITE_API_BASE_URL="${{ secrets.VITE_API_BASE_URL }}" \
            --build-arg VITE_RAZORPAY_KEY_ID="${{ secrets.VITE_RAZORPAY_KEY_ID }}" \
            --build-arg VITE_OAUTH2_REDIRECT_URI="${{ secrets.VITE_OAUTH2_REDIRECT_URI }}" \
            --build-arg VITE_APP_NAME="${{ secrets.VITE_APP_NAME }}" \
            -t $IMAGE .

          docker push $IMAGE

      - name: Trigger Render deployment
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"